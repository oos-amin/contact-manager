<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main -->
    <main class="main">
      <div class="container">
        <!-- Contact Header -->
        <section class="contact-header">
          <h1 class="contact-header__title">مدیریت مخاطبین</h1>
          <p class="contact-header__caption">
            مخاطبین خود را مدیریت و جستجو کنید
          </p>
        </section>

        <!-- Contact Search -->
        <section class="contact-search">
          <div class="contact-search__wrapper">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
              width="24"
              height="24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              />
            </svg>
            <input
              type="text"
              class="contact-search__input"
              placeholder="جستجوی مخاطبین..."
            />
          </div>
          <button class="contact-search-btn btn">
            افزودن مخاطب
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
              width="24"
              height="24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 4.5v15m7.5-7.5h-15"
              />
            </svg>
          </button>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
