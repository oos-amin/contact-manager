<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main -->
    <main class="main">
      <div class="container">
        <!-- Contact Header -->
        <section class="contact-header">
          <h1 class="contact-header__title">مدیریت مخاطبین</h1>
          <p class="contact-header__caption">
            مخاطبین خود را مدیریت و جستجو کنید
          </p>
        </section>

        <!-- Contact Search -->
        <section class="contact-search">
          <div class="contact-search__wrapper">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
              width="24"
              height="24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              />
            </svg>
            <input
              type="text"
              class="contact-search__input"
              placeholder="جستجوی مخاطبین..."
            />
          </div>
          <button class="contact-search-btn btn">
            افزودن مخاطب
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
              width="24"
              height="24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 4.5v15m7.5-7.5h-15"
              />
            </svg>
          </button>
        </section>

        <!-- Contacts -->
        <section class="contacts">
          <p class="contacts__status">
            <!-- Data Loads from JS -->
          </p>

          <div class="contacts__container">
            <!-- Data Loads from JS -->
          </div>

          <!-- Pagination -->
          <div class="paginations">
            <div class="pagination-container" dir="ltr">
              <!-- Data loads from JS -->
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Add Contact Modal -->
    <div class="add-modal modal hidden">
      <div class="modal-screen">
        <h2 class="add-modal__title">افزودن مخاطب جدید</h2>
        <div class="add-modal__name">
          <label for="" class="add-modal__label">نام *</label>
          <input
            type="text"
            class="add-modal__input"
            placeholder="محمدامین معینی"
            autocomplete="none"
            id="contact-input__name"
          />
          <p class="input__name-error"></p>
        </div>

        <div class="add-modal__email">
          <label for="" class="add-modal__label">ایمیل *</label>
          <input
            type="email"
            class="add-modal__input"
            placeholder="amin47moeini@gmail.com"
            autocomplete="none"
            id="contact-input__email"
          />
          <p class="input__email-error"></p>
        </div>

        <div class="add-modal__phone">
          <label for="" class="add-modal__label">شماره تلفن *</label>
          <input
            type="text"
            inputmode="numeric"
            class="add-modal__input"
            placeholder="09139774603"
            autocomplete="none"
            maxlength="11"
            id="contact-input__phone"
          />
          <p class="input__phone-error"></p>
          <p class="input__phone-error2"></p>
        </div>

        <div class="add-modal__tag">
          <label for="" class="add-modal__label">تگ *</label>
          <input
            type="text"
            class="add-modal__input"
            placeholder="دسته بندی (خانواده، دوست، همکار و ...)"
            autocomplete="none"
            id="contact-input__tag"
          />
          <p class="input__tag-error"></p>
        </div>

        <div class="add-modal__actions">
          <button class="add-modal__btn-confirm btn">افزودن مخاطب</button>
          <button class="add-modal__btn-cancel btn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- Edit Contact Modal -->
    <div class="edit-modal modal hidden">
      <div class="modal-screen">
        <h2 class="add-modal__title">ویرایش مخاطب</h2>
        <div class="add-modal__name">
          <label for="" class="add-modal__label">نام *</label>
          <input
            type="text"
            class="add-modal__input"
            placeholder="محمدامین معینی"
            autocomplete="none"
            id="edit-input__name"
          />
          <p class="edit__name-error"></p>
        </div>

        <div class="add-modal__email">
          <label for="" class="add-modal__label">ایمیل *</label>
          <input
            type="email"
            class="add-modal__input"
            placeholder="amin47moeini@gmail.com"
            autocomplete="none"
            id="edit-input__email"
          />
          <p class="edit__email-error"></p>
        </div>

        <div class="add-modal__phone">
          <label for="" class="add-modal__label">شماره تلفن *</label>
          <input
            type="text"
            inputmode="numeric"
            class="add-modal__input"
            placeholder="09139774603"
            autocomplete="none"
            maxlength="11"
            id="edit-input__phone"
          />
          <p class="edit__phone-error"></p>
          <p class="edit__phone-error2"></p>
        </div>

        <div class="add-modal__tag">
          <label for="" class="add-modal__label">تگ *</label>
          <input
            type="text"
            class="add-modal__input"
            placeholder="دسته بندی (خانواده، دوست، همکار و ...)"
            autocomplete="none"
            id="edit-input__tag"
          />
          <p class="edit__tag-error"></p>
        </div>

        <div class="edit-modal__actions">
          <button class="edit-modal__btn-confirm btn">ویرایش مخاطب</button>
          <button class="edit-modal__btn-cancel btn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- Remove Contact Modal -->
    <div class="remove-modal modal hidden">
      <div class="modal-screen">
        <h2 class="remove-modal__title">حذف مخاطب</h2>
        <p class="remove-modal__caption">آیا از حذف این مخاطب اطمینان دارید؟</p>
        <div class="remove-modal__actions">
          <button class="remove-modal__btn-confirm btn">بله</button>
          <button class="remove-modal__btn-cancel btn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast">
      <div class="toast__content">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="#fff"
          class="size-6"
          width="30"
          height="30"
        >
          <path
            fill-rule="evenodd"
            d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 0 1 .67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 1 1-.671-1.34l.041-.022ZM12 9a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"
            clip-rule="evenodd"
          />
        </svg>
        <span class="toast__content-title">مخاطب حذف شد</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
